<script>
/* QR Code generator ringkas (byte mode, ECC M) — berdasarkan algoritma Project Nayuki (MIT) */
const QR = (() => {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26];
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];
  const FMT_M = 0;
  const bit = (x, i) => ((x >>> i) & 1) !== 0;
  const rawModules = v => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  };
  const dataCodewords = v => Math.floor(rawModules(v) / 8) - ECC[v] * BLK[v];
  const gmul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; };
  const rsDivisor = d => {
    const r = new Array(d).fill(0); r[d - 1] = 1; let root = 1;
    for (let i = 0; i < d; i++) {
      for (let j = 0; j < d; j++) { r[j] = gmul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; }
      root = gmul(root, 0x02);
    }
    return r;
  };
  const rsRemainder = (data, div) => {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= gmul(c, f)); }
    return r;
  };
  const alignPos = (v, size) => {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2;
    const step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const res = [6];
    for (let p = size - 7; res.length < n; p -= step) res.splice(1, 0, p);
    return res;
  };

  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(String(text)));
    let ver = 1;
    for (; ver <= 20; ver++) {
      const need = 4 + (ver <= 9 ? 8 : 16) + bytes.length * 8;
      if (need <= dataCodewords(ver) * 8) break;
    }
    if (ver > 20) throw new Error('Teks terlalu panjang untuk QR');
    const cap = dataCodewords(ver) * 8;
    const bb = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1); };
    push(4, 4); push(bytes.length, ver <= 9 ? 8 : 16); bytes.forEach(b => push(b, 8));
    push(0, Math.min(4, cap - bb.length));
    push(0, (8 - bb.length % 8) % 8);
    for (let p = 0xEC; bb.length < cap; p ^= 0xEC ^ 0x11) push(p, 8);
    const data = [];
    for (let i = 0; i < bb.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bb[i + j]; data.push(v); }

    // ECC + interleave
    const nb = BLK[ver], el = ECC[ver], raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const div = rsDivisor(el), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((b, j) => { if (i !== shortLen - el || j >= nShort) all.push(b[i]); });

    // matrix
    const size = ver * 4 + 17;
    const M = [...Array(size)].map(() => new Array(size).fill(false));
    const F = [...Array(size)].map(() => new Array(size).fill(false));
    const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(([x, y]) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4);
      }
    });
    const ap = alignPos(ver, size), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        set(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = (FMT_M << 3) | mask; let r = d;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) set(8, i, bit(b, i));
      set(8, 7, bit(b, 6)); set(8, 8, bit(b, 7)); set(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(b, i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++) { const a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, bit(b, i)); set(c, a, bit(b, i)); }
    }
    // codewords
    let idx = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (!F[y][x] && idx < all.length * 8) { M[y][x] = bit(all[idx >>> 3], 7 - (idx & 7)); idx++; }
      }
    }
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && maskFn[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      const line = get => {
        let run = 1, s = '';
        for (let i = 0; i < size; i++) {
          const c = get(i); s += c ? '1' : '0';
          if (i > 0) { if (c === get(i - 1)) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; }
        }
        const t = '0000' + s + '0000';
        for (let k = t.indexOf('10111010000'); k >= 0; k = t.indexOf('10111010000', k + 1)) p += 40;
        for (let k = t.indexOf('00001011101'); k >= 0; k = t.indexOf('00001011101', k + 1)) p += 40;
      };
      for (let y = 0; y < size; y++) line(i => M[y][i]);
      for (let x = 0; x < size; x++) line(i => M[i][x]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        const c = M[y][x]; if (c === M[y][x + 1] && c === M[y + 1][x] && c === M[y + 1][x + 1]) p += 3;
      }
      M.forEach(r => r.forEach(c => { if (c) dark++; }));
      const total = size * size;
      p += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const p = penalty(); if (p < bestP) { bestP = p; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return { size, modules: M, version: ver };
  }

  function svg(text, border) {
    const q = encode(text), b = border == null ? 4 : border, n = q.size + b * 2;
    let d = '';
    for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.modules[y][x]) d += `M${x + b},${y + b}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return { encode, svg };
})();
</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRM = n => (n === '' || n == null) ? '' : Number(n).toLocaleString('ms-MY', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtN = n => (n === '' || n == null) ? '' : Number(n).toLocaleString('ms-MY', {maximumFractionDigits: 2});
const API = window.ESTOK_API_URL || '';
const PAGE_URL = location.origin + location.pathname;
async function run(fn, ...args){
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API)) throw new Error('URL API belum ditetapkan dalam config.js.');
  let r;
  try {
    // text/plain = "simple request" (tiada CORS preflight) — Apps Script membalas dengan JSON
    const res = await fetch(API, { method: 'POST', body: JSON.stringify({ fn, args, akses: S.akses }), redirect: 'follow' });
    const txt = await res.text();
    try { r = JSON.parse(txt); }
    catch(x) {
      throw new Error(/doPost/i.test(txt) ? 'Server belum dikemas kini (tiada doPost). Paste Code.gs terbaru & Deploy > Manage deployments > New version.'
        : /accounts\.google|ServiceLogin|signin/i.test(txt) ? 'Deployment perlu log masuk Google. Tetapkan Web app: Execute as "Me", Who has access "Anyone".'
        : 'Server tidak pulangkan data yang sah (' + res.status + '). Semak URL /exec dalam config.js & tetapan deployment.');
    }
  } catch(e) {
    throw (e.message && /Server|Deployment/.test(e.message)) ? e : new Error('Tidak dapat menghubungi server. Semak internet & URL /exec dalam config.js.');
  }
  if (!r.ok) {
    const e = new Error(r.error || 'Ralat server.');
    if (r.code === 'AKSES') { e.akses = true; if (fn !== 'checkAkses') setTimeout(() => gate('Kod akses telah ditukar atau tidak sah. Sila masukkan kod baru.'), 0); }
    throw e;
  }
  return r.result;
}
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },

  document.body.appendChild(d); setTimeout(() => d.remove(), err ? 4500 : 2800);

  toast(m, true);
}
function busy(btn, on, txt){
  if (!btn) return;
  if (on) { btn.dataset.t = btn.textContent; btn.textContent = txt || 'Sila tunggu…'; btn.disabled = true; }
  else { btn.textContent = btn.dataset.t || btn.textContent; btn.disabled = false; }
}
const pegSel = (id, sel) => {
  const L = (S.pegawai || []).slice().sort((a, b) => a.nama.localeCompare(b.nama));
  const cur = String(sel || ls.get('estok_peg') || '').toUpperCase();

    (L.length ? '' : '<div class="mu" style="font-size:12px;margin-top:4px">Tiada staf aktif — admin perlu tambah di Admin › Urus staf.</div>');
};
const pegNama = id => { const p = (S.pegawai || []).find(x => x.id === String(id).toUpperCase()); return p ? p.nama : ''; };
const sgn = (j, q) => j === 'KELUAR' ? '−' + fmtN(Math.abs(q)) : (j === 'LARASAN' ? (q > 0 ? '+' : q < 0 ? '−' : '') + fmtN(Math.abs(q)) : '+' + fmtN(q));
const itemBy = k => S.items.find(i => i.kod === k);
const stCls = i => i.aktif ? i.status : 'X';
const stTxt = i => i.aktif ? i.status : 'TIDAK AKTIF';

const getLoc = () => Promise.resolve({ parameter: Object.fromEntries(new URLSearchParams(location.search)) });
const qrUrl = kod => PAGE_URL + '?item=' + encodeURIComponent(kod);
async function load(silent){
  try {
    const [d, loc] = await Promise.all([run('getData'), silent ? Promise.resolve(null) : getLoc()]);
    Object.assign(S, d); S.appUrl = PAGE_URL;
    document.body.classList.remove('locked');
    if (loc && loc.parameter && loc.parameter.item) {
      const k = String(loc.parameter.item).toUpperCase(), it = S.items.find(i => i.kod.toUpperCase() === k);
      if (it) {
        S.scan = it.kod; S.recKod = it.kod; S.tab = 'rekod';
        const j = String(loc.parameter.j || '').toUpperCase();
        S.recJenis = (j === 'MASUK' || j === 'TERIMA') ? 'TERIMA' : (j === 'KELUAR' ? 'KELUAR' : '');

/* ---------- Pintu kod akses ---------- */
function gate(msg){
  document.body.classList.add('locked'); closeModal();
  $('#view').innerHTML = `<div class="gate"><div class="box">
    <div class="glogo">🔒</div><b style="font-size:18px">e-Stok HDU</b>

    <label style="text-align:left">Kod akses</label>

  const go3 = async () => {
    const k = $('#gk').value.trim().toUpperCase(); if (!k) return;
    const b = $('#gb'); busy(b, true, 'Menyemak…');
    try {
      await run('checkAkses', k);
      S.akses = k; ls.set('estok_akses', k);
      document.querySelectorAll('.toast').forEach(t => t.remove());
      $('#view').innerHTML = '<div class="ld">Memuatkan data…</div>';
      render0();
    } catch(e) { toast(e.message, true); busy(b, false); $('#gk').select(); }

  $('#gb').onclick = go3;
  $('#gk').onkeydown = e => { if (e.key === 'Enter') go3(); };
  setTimeout(() => $('#gk') && $('#gk').focus(), 50);
}
function render0(){ load(); }

$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.t); });
function go(t){
  S.tab = t;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  render(); window.scrollTo(0, 0);
}
function render(){ ({ senarai: vSenarai, rekod: vRekod, laporan: vLaporan, admin: vAdmin })[S.tab](); }

/* ---------------- SENARAI ---------------- */

  const act = S.items.filter(i => i.aktif);

  $('#view').innerHTML = `
    <div class="cards">
      <button class="stat" data-st=""><b>${act.length}</b><span>Item aktif</span></button>
      <button class="stat a" data-st="RENDAH"><b>${low}</b><span>Stok rendah</span></button>

    </div>
    <div class="bar">
      <input id="fq" type="search" placeholder="Cari nama / kod / lokasi…" value="${esc(S.f.q)}">

      <select id="fs">
        ${[['','Semua status'],['OK','OK'],['RENDAH','Rendah'],['HABIS','Habis'],['TIDAK AKTIF','Tidak aktif']].map(([v,t]) => `<option value="${v}" ${v === S.f.st ? 'selected' : ''}>${t}</option>`).join('')}

function renderList(){

  const f = S.f, q = f.q.trim().toLowerCase();

      (f.st === 'TIDAK AKTIF' ? !i.aktif : i.aktif) &&
      (!f.st || f.st === 'TIDAK AKTIF' || i.status === f.st) &&
      (!f.kat || i.kategori === f.kat) &&
      (!q || (i.nama + ' ' + i.kod + ' ' + i.lokasi).toLowerCase().includes(q)))
    .sort((a, b) => (ord[a.status] ?? 3) - (ord[b.status] ?? 3) || a.nama.localeCompare(b.nama));
  el.innerHTML = list.length ? list.map(i => `
    <div class="it" data-kod="${esc(i.kod)}">

    : '<div class="box mu">Tiada transaksi lagi.</div>';
}

async function openItem(kod){

        <div class="tw only-wide"><table class="kps">

          ${r.jenis === 'BAKI AWAL' ? '<td colspan="5"><i>Baki dibawa ke hadapan</i></td>' :
          `<td class="n">${fmtN(r.tq)}</td><td class="n">${fmtRM(r.tseu)}</td><td class="n">${fmtRM(r.tjum)}</td><td class="n">${fmtN(r.kq)}</td><td class="n">${fmtRM(r.kjum)}</td>`}
          <td class="n"><b>${fmtN(r.bq)}</b></td><td class="n">${fmtRM(r.bjum)}</td><td title="${esc(pegNama(r.peg))}"><b>${esc(r.peg)}</b></td></tr>`).join('')}</table></div>`
        : '<div class="mu">Tiada transaksi lagi.</div>'}`);
    document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.recJenis = b.dataset.go; S.recKod = it.kod; S.scan = it.kod; closeModal(); go('rekod'); });

  } catch(e) { closeModal(); fail(e); }
}

/* ---------------- REKOD ---------------- */
function itemOptions(list, sel){
  const g = {};
  list.forEach(i => (g[i.kategori || 'Lain-lain'] = g[i.kategori || 'Lain-lain'] || []).push(i));
  return '<option value="">— Pilih item —</option>' + Object.keys(g).sort().map(k =>
    `<optgroup label="${esc(k)}">${g[k].sort((a,b) => a.nama.localeCompare(b.nama)).map(i =>
      `<option value="${esc(i.kod)}" ${i.kod === sel ? 'selected' : ''}>${esc(i.nama)} (${fmtN(i.baki)} ${esc(i.unit)})</option>`).join('')}</optgroup>`).join('');
}

function vRekod(){
  const j = S.recJenis;
  const sc = S.scan ? itemBy(S.scan) : null;
  const head = sc ? `<div class="scan">

      <div style="margin-top:8px"><span id="scBaki" style="font-size:28px;font-weight:800">${fmtN(sc.baki)}</span> ${esc(sc.unit)}
        <span class="bd ${stCls(sc)}" id="scSt">${stTxt(sc)}</span></div>
      ${sc.aktif ? '' : '<div class="err" style="margin-top:8px">Item ini tidak aktif.</div>'}

      <button class="T ${j === 'TERIMA' ? 'on' : ''}" data-j="TERIMA">＋ MASUK<small>Terima stok</small></button>
      <button class="K ${j === 'KELUAR' ? 'on' : ''}" data-j="KELUAR">－ KELUAR<small>Keluar / guna</small></button></div>`;
  const form = !j ? (sc ? '<p class="mu" style="text-align:center;margin:14px 0 4px">Pilih MASUK atau KELUAR</p>' : '') : `
    <div ${sc ? 'style="display:none"' : ''}>

    <div class="row2">
      <div><label>Kuantiti *</label><input id="rqty" type="number" inputmode="decimal" min="0" step="any" ${sc ? 'autofocus' : ''}></div>
      ${j === 'TERIMA' ? '<div><label>Harga seunit (RM)</label><input id="rharga" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Kosong = harga purata"></div>' : '<div></div>'}

    <label>No. PK / BTB / BPSS / BPSI / BPIN</label><input id="rruj" maxlength="60" placeholder="${j === 'TERIMA' ? 'cth. No. BTB / PK' : 'cth. No. BPSI / BPSS'}">
    <label>${j === 'TERIMA' ? 'Terima daripada' : 'Keluar kepada'}</label><input id="rpihak" maxlength="80" list="pihakList" placeholder="${j === 'TERIMA' ? 'cth. Stor Farmasi / Pembekal' : 'cth. Bilik HD 1 / Wad'}">
    <datalist id="pihakList">${(j === 'TERIMA' ? ['Stor Farmasi', 'Stor Perubatan', 'Pembekal'] : ['Bilik HD 1', 'Bilik HD 2', 'Bilik Isolasi', 'Wad']).map(x => `<option value="${x}">`).join('')}</datalist>

  $('#view').innerHTML = head + `<div class="box">${seg}${form}</div>` +
    (sc ? `<p style="text-align:center"><a href="#" id="unscan">Rekod item lain</a> · <a href="#" id="viewcard">Lihat kad stok</a></p>` : '');

  if ($('#viewcard')) $('#viewcard').onclick = e => { e.preventDefault(); openItem(S.scan); };

    const q = $('#rq').value.trim().toLowerCase();

/** Amaran terus dalam borang (bukan toast sahaja) bila stok tidak mencukupi untuk KELUAR */
function habisCheck(){
  const box = $('#rmsg'), b = $('#rbtn'); if (!box || !b) return;
  const i = itemBy($('#ri') ? $('#ri').value : ''), q = Number($('#rqty') ? $('#rqty').value : 0);
  let m = '';
  if (S.recJenis === 'KELUAR' && i) {
    if (i.baki <= 0) m = `<b>Stok ${esc(i.nama)} HABIS (0 ${esc(i.unit)}).</b> Tidak boleh rekod KELUAR. Rekod MASUK dahulu jika stok baru diterima, atau semak dengan admin.`;
    else if (q > i.baki) m = `<b>Kuantiti (${fmtN(q)}) melebihi baki semasa (${fmtN(i.baki)} ${esc(i.unit)}).</b> Kurangkan kuantiti.`;
  }
  box.innerHTML = m ? `<div class="err" style="margin-top:12px;font-size:14px">⚠️ ${m}</div>` : '';
  b.disabled = !!m;
}
function formMsg(m){ const box = $('#rmsg'); if (box) box.innerHTML = `<div class="err" style="margin-top:12px;font-size:14px">⚠️ ${esc(m)}</div>`; }

async function submitTx(){
  const kod = $('#ri').value, qty = Number($('#rqty').value), oleh = $('#roleh').value.trim();
  const stop = m => { formMsg(m); toast(m, true); };
  if (!kod) return stop('Sila pilih item.');
  if (!(qty > 0)) return stop('Sila isi kuantiti yang sah (lebih daripada 0).');
  if (!oleh) return stop('Sila pilih nama pegawai.');
  const i = itemBy(kod);
  if (S.recJenis === 'KELUAR' && i && qty > i.baki) return stop(i.baki <= 0 ? `Stok ${i.nama} HABIS (0 ${i.unit}) — tidak boleh rekod KELUAR.` : `Kuantiti (${qty}) melebihi baki semasa (${fmtN(i.baki)} ${i.unit}).`);
  $('#rmsg').innerHTML = '';
  const b = $('#rbtn'); busy(b, true, 'Menyimpan…');
  try {
    const r = await run('recordTx', { kod, jenis: S.recJenis, qty, oleh, ruj: $('#rruj').value, pihak: $('#rpihak').value,
      harga: $('#rharga') ? $('#rharga').value : '', catatan: $('#rcat').value });
    ls.set('estok_peg', oleh);
    if (i) { i.baki = r.baki; i.status = r.status; i.nilai = r.nilai; i.harga = r.harga; }
    if (navigator.vibrate) try { navigator.vibrate(60); } catch(e) {}
    toast(`Disimpan. Baki ${r.nama}: ${fmtN(r.baki)} ${r.unit}${r.status !== 'OK' ? ' (' + r.status + ')' : ''}`);
    $('#rqty').value = ''; $('#rruj').value = ''; $('#rcat').value = ''; if ($('#rharga')) $('#rharga').value = '';
    $('#ri').innerHTML = itemOptions(S.items.filter(x => x.aktif && (!$('#rq').value.trim() || (x.nama + ' ' + x.kod).toLowerCase().includes($('#rq').value.trim().toLowerCase()))), kod);
    $('#rinfo').innerHTML = i ? `<div class="info">Baki semasa: <b>${fmtN(i.baki)} ${esc(i.unit)}</b> · <span class="bd ${stCls(i)}">${stTxt(i)}</span></div>` : '';
    if (S.scan && i && $('#scBaki')) { $('#scBaki').textContent = fmtN(i.baki); $('#scSt').className = 'bd ' + stCls(i); $('#scSt').textContent = stTxt(i); }
    habisCheck();
    load(true);
  } catch(e) { fail(e); formMsg(e.message); }
  busy(b, false);
  habisCheck();
}

function csvParse(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const d = (first.split(';').length > first.split(',').length) ? ';' : (first.includes('\t') && !first.includes(',') ? '\t' : ',');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === '') q = true;
    else if (c === d) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
function csvMap(rows, map){
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const idx = {}; Object.keys(map).forEach(k => { idx[k] = head.findIndex(h => map[k].includes(h)); });
  const numF = ['min', 'bakiAwal', 'harga'];
  const nf = v => { v = v.replace(/\s|RM/gi, ''); if (/,\d{1,2}$/.test(v) && !v.includes('.')) v = v.replace(/\.(?=\d{3})/g, '').replace(',', '.'); return v.replace(/,/g, ''); };
  return { idx, data: rows.slice(1).map((r, i) => { const o = { line: i + 2 }; Object.keys(idx).forEach(k => { o[k] = idx[k] >= 0 ? String(r[idx[k]] ?? '').trim() : ''; if (numF.includes(k) && o[k]) o[k] = nf(o[k]); }); return o; }) };
}
function csvDownload(name, head, rows){
  const q = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '﻿' + [head].concat(rows).map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

async function doImport(jenis, data){
  const b = $('#imgo'); b.disabled = true;
  const tot = { added: 0, updated: 0, skipped: 0, errors: [] };
  const size = jenis === 'item' ? 10 : 100;
  try {
    for (let i = 0; i < data.length; i += size) {
      b.textContent = `Mengimport… ${Math.min(i + size, data.length)} / ${data.length}`;
      const chunk = data.slice(i, i + size);
      const r = jenis === 'item' ? await run('importItems', S.token, chunk, $('#imm').value) : await run('importStaf', S.token, chunk);
      tot.added += r.added; tot.updated += r.updated; tot.skipped += r.skipped; tot.errors = tot.errors.concat(r.errors);
    }
    toast('Import selesai.');
  } catch(e) { fail(e); }
  b.textContent = 'Selesai'; 
  $('#imres').innerHTML = `<div class="info" style="margin-top:10px">Ditambah: <b>${tot.added}</b> · Dikemas kini: <b>${tot.updated}</b> · Diabaikan: <b>${tot.skipped}</b> · Ralat: <b>${tot.errors.length}</b>
    ${tot.errors.length ? '<br>' + tot.errors.map(e => `Baris ${e.line}: ${esc(e.msg)}`).join('<br>') : ''}</div>`;
  S.stafList = null; load(true);
}

      <div><label>&nbsp;</label><label class="chk" style="margin:0;min-height:46px"><input type="checkbox" id="qall" checked> Pilih semua</label></div></div>
    <div id="qlist" class="plist" style="max-height:40vh;overflow:auto;margin-top:8px"></div>
    <button id="qbtn" class="btn full" style="margin-top:14px">Seterusnya ›</button></div>`;
  const opt = () => {
    const z = P.mode === 'zebra';
    $('#qopt').innerHTML = z ? `
      <div class="row2"><div><label>Saiz sticker</label><select id="qz">${ZSIZES.map(([v, t]) => `<option value="${v}" ${v === P.z ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label>Salinan setiap item</label><input id="qc" type="number" min="1" max="50" value="${P.copies}" inputmode="numeric"></div></div>
      <div class="row2" id="qwh" style="${P.z === 'custom' ? '' : 'display:none'}"><div><label>Lebar (mm)</label><input id="qw" type="number" min="25" max="104" value="${P.w}"></div><div><label>Tinggi (mm)</label><input id="qh" type="number" min="15" max="150" value="${P.h}"></div></div>
      <p class="mu" style="font-size:12.5px;margin:8px 0 0">GK420t: lebar maksimum 104 mm. Saiz mesti sama dengan sticker dalam printer.</p>`
      : `<label>Saiz label A4</label><select id="qs"><option value="kecil" ${P.a4 === 'kecil' ? 'selected' : ''}>Kecil (4 × 6 setiap A4)</option><option value="sederhana" ${P.a4 === 'sederhana' ? 'selected' : ''}>Sederhana (3 × 4 setiap A4)</option><option value="besar" ${P.a4 === 'besar' ? 'selected' : ''}>Besar (2 × 3 setiap A4)</option></select>`;
    if (z) $('#qz').onchange = () => { $('#qwh').style.display = $('#qz').value === 'custom' ? '' : 'none'; };
  };
  document.querySelectorAll('#qmode button').forEach(b => b.onclick = () => {
    P.mode = b.dataset.m; document.querySelectorAll('#qmode button').forEach(x => x.className = x === b ? 'on T' : ''); opt();
  });
  const draw = () => {
    const k = $('#qk').value;
    const L = act.filter(i => !k || i.kategori === k);
    $('#qlist').innerHTML = L.map(i => `<label class="prow" style="cursor:pointer"><input type="checkbox" class="qi" value="${esc(i.kod)}" ${$('#qall').checked ? 'checked' : ''}>
      <div class="pl"><b>${esc(i.nama)}</b><small>${esc(i.kod)}${i.lokasi ? ' · ' + esc(i.lokasi) : ''}</small></div></label>`).join('') || '<div class="prow mu">Tiada item.</div>';
  };
  $('#qk').onchange = draw; $('#qall').onchange = draw; opt(); draw();
  $('#qbtn').onclick = () => {
    const kods = [...document.querySelectorAll('.qi:checked')].map(x => x.value);
    if (!kods.length) return toast('Pilih sekurang-kurangnya satu item.', true);
    if (P.mode === 'zebra') {
      P.z = $('#qz').value; P.copies = Math.min(50, Math.max(1, parseInt($('#qc').value, 10) || 1));
      if (P.z === 'custom') { P.w = Math.min(104, Math.max(25, Number($('#qw').value) || 50)); P.h = Math.min(150, Math.max(15, Number($('#qh').value) || 30)); }
    } else P.a4 = $('#qs').value;
    lblSave(P);
    printLabels(kods);
  };
}

function zSize(P){ if (P.z === 'custom') return [P.w, P.h]; const [w, h] = P.z.split('x').map(Number); return [w, h]; }
const zTxt = s => String(s == null ? '' : s).replace(/[\^~\\]/g, ' ').replace(/\s+/g, ' ').trim();

/** Jana ZPL untuk Zebra 203 dpi (GK420t): QR kiri + teks kanan (hitam penuh, tanpa latar) */
function zplFor(items, P){
  const [wmm, hmm] = zSize(P), D = 8; // 8 dot/mm = 203 dpi
  const W = Math.round(wmm * D), H = Math.round(hmm * D), copies = P.copies || 1;
  return items.map(i => {
    const url = qrUrl(i.kod), n = QR.encode(url).size;
    const maxQ = Math.min(H - 20, Math.round(W * 0.48));
    const mag = Math.max(1, Math.min(10, Math.floor(maxQ / n)));
    const qs = n * mag, qx = 12, qy = Math.max(2, Math.round((H - qs) / 2) - 6);
    const tx = qx + qs + 14, tw = Math.max(60, W - tx - 8);
    const k = Math.max(0.75, Math.min(2.2, hmm / 30, tw / 168));
    const fh = Math.round(18 * k), fn = Math.round(33 * k), fk = Math.round(23 * k), fb = Math.round(18 * k);
    let y = Math.max(8, Math.round(H * 0.08));
    const out = ['^XA', '^CI28', '^PR3', `^PW${W}`, `^LL${H}`, '^LH0,0',
      `^FO${qx},${qy}^BQN,2,${mag}^FDMA,${url}^FS`,
      `^FO${tx},${y}^A0N,${fh},${fh}^FDHDU HSAS^FS`];
    y += fh + 6;
    out.push(`^FO${tx},${y}^A0N,${fn},${fn}^FB${tw},2,0,L,0^FD${zTxt(i.nama)}^FS`); y += fn * 2 + 4;
    out.push(`^FO${tx},${y}^A0N,${fk},${fk}^FB${tw},1,0,L,0^FD${zTxt(i.kod)}${i.unit ? ' - ' + zTxt(i.unit) : ''}^FS`); y += fk + 4;
    const by = H - fb - 16;
    if (i.lokasi && hmm >= 30 && y + fk < by - 4) { out.push(`^FO${tx},${y}^A0N,${fk},${fk}^FB${tw},1,0,L,0^FD${zTxt(i.lokasi)}^FS`); y += fk + 4; }
    const bw = Math.min(tw, Math.round(fb * 8.6));
    out.push(`^FO${tx},${by - 5}^GB${bw},${fb + 10},2^FS`, `^FO${tx},${by}^A0N,${fb},${fb}^FB${bw},1,0,C,0^FDMASUK / KELUAR^FS`);
    out.push(`^PQ${copies},0,1,Y`, '^XZ');
    return out.join('\n');
  }).join('\n');
}

/** Hantar ZPL terus ke printer melalui apps Zebra Browser Print (dipasang pada PC) */
async function zebraSend(zpl){
  let last;
  for (const base of ['http://127.0.0.1:9100', 'https://127.0.0.1:9101', 'http://localhost:9100']) {
    try {
      const t = await (await fetch(base + '/default?type=printer')).text();
      if (!t || !t.trim()) throw new Error('Tiada printer lalai dalam Zebra Browser Print.');
      const dev = JSON.parse(t);
      const r = await fetch(base + '/write', { method: 'POST', body: JSON.stringify({ device: dev, data: zpl }) });
      if (!r.ok) throw new Error('Printer menolak data (' + r.status + ').');
      return dev.name || 'Zebra';
    } catch(e) { last = e; if (/Tiada printer|menolak/.test(e.message)) throw e; }
  }
  throw new Error('Zebra Browser Print tidak dapat dihubungi. Pastikan apps Zebra Browser Print dipasang & sedang berjalan pada PC ini, laman ini dibenarkan (Accept), dan guna Chrome/Edge di PC.');
}

function dl(name, txt, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: type || 'text/plain' }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function printLabels(kods){
  const items = kods.map(itemBy).filter(Boolean), P = lblPref();
  const lblBody = i => `<div class="lq">${QR.svg(qrUrl(i.kod), 1)}</div>
      <div class="lt"><div class="lh">e-Stok HDU · HSAS</div><div class="ln">${esc(i.nama)}</div>
        <div class="lk">${esc(i.kod)}${i.unit ? ' · ' + esc(i.unit) : ''}</div>${i.lokasi ? `<div class="lk">${esc(i.lokasi)}</div>` : ''}
        <div class="la"><span class="in">MASUK</span><span class="out">KELUAR</span></div><div class="lf">Imbas untuk rekod</div></div>`;
  const ps = $('#pagesize'); if (ps) ps.remove();
  if (P.mode === 'zebra') {
    const [w, h] = zSize(P), copies = P.copies || 1;
    const st = document.createElement('style'); st.id = 'pagesize';
    const qmm = Math.max(10, Math.min(h - 7, w * 0.48)), k = Math.max(0.75, Math.min(2.2, h / 30, (w - qmm - 6) / 21));
    // tinggi kandungan 1 mm kurang daripada sticker: elak limpahan yang menyebabkan sticker kosong selang-seli
    st.textContent = `@media print{@page{size:${w}mm ${h}mm;margin:0}html,body{width:${w}mm;margin:0!important;padding:0!important}}
      .zl{width:${w}mm;height:${(h - 1).toFixed(1)}mm;--k:${k.toFixed(2)}} .zl .lq{width:${qmm.toFixed(1)}mm}`;
    document.head.appendChild(st);
    const many = items.flatMap(i => Array(copies).fill(i));
    const zBody = i => `<div class="lq">${QR.svg(qrUrl(i.kod), 1)}</div>
      <div class="lt"><div class="zh">HDU HSAS</div><div class="zn">${esc(i.nama)}</div>
        <div class="zk">${esc(i.kod)}${i.unit ? ' · ' + esc(i.unit) : ''}</div>${i.lokasi && h >= 30 ? `<div class="zk" style="font-weight:600">${esc(i.lokasi)}</div>` : ''}
        <div class="zb">MASUK / KELUAR</div></div>`;
    modal(`<div class="mh np"><div><b>Sticker Zebra ${w} × ${h} mm</b><br><span class="mu">${items.length} item × ${copies} salinan = ${many.length} sticker</span></div><button class="x" data-close>×</button></div>
      <div class="np zbtns">
        <button class="btn" id="zp1">🖨️ Cetak (driver ZDesigner)</button>
        <button class="btn sec" id="zp2">⚡ Hantar terus ZPL (Zebra Browser Print)</button>
        <button class="btn sec" id="zp3">⬇ Muat turun fail .zpl</button>
      </div>
      <details class="np" style="margin:4px 0 10px"><summary class="mu" style="cursor:pointer">Tetapan printer GK420t (baca sekali)</summary>
        <div class="info" style="font-size:13px">• <b>Cetak (driver)</b>: Printer → <b>ZDesigner GK420t</b>, Paper size <b>${w} × ${h} mm</b>, Margin <b>None</b>, Scale <b>100%</b>, matikan <i>Headers and footers</i>.<br>
        • Dalam <i>Printing Preferences</i> driver: Page Setup = ${w} × ${h} mm, Orientation Landscape jika perlu.<br>
        • <b>Sticker kosong selang-seli?</b> Paper size dalam dialog cetak / driver tidak sama dengan sticker. Dalam ZDesigner <i>Printing Preferences › Page Setup › Stocks › New</i>: Width ${w} mm, Height ${h} mm, Media <i>Labels with gaps</i>, kemudian pilih saiz itu dalam dialog cetak.<br>
        • Kemudian tekan & tahan butang FEED sehingga lampu berkelip <b>sekali</b>, lepaskan — printer kalibrasi saiz sticker.<br>
        • <b>Hantar terus ZPL</b> paling tepat & laju — perlu apps percuma <b>Zebra Browser Print</b> dipasang pada PC yang disambung ke printer (Chrome/Edge).</div></details>
      <div class="zlabels">${many.map(i => `<div class="zl">${zBody(i)}</div>`).join('')}</div>`);
    document.body.classList.add('printlbl', 'printz');
    $('#zp1').onclick = () => window.print();
    $('#zp2').onclick = async () => {
      const b = $('#zp2'); busy(b, true, 'Menghantar…');
      try { const n = await zebraSend(zplFor(items, P)); toast(`${many.length} sticker dihantar ke ${n}.`); } catch(e) { toast(e.message, true); }
      busy(b, false);
    };
    $('#zp3').onclick = () => dl(`label-qr-${w}x${h}.zpl`, zplFor(items, P));
  } else {
    modal(`<div class="mh np"><div><b>Label QR (${items.length})</b><br><span class="mu">Cetak pada kertas A4 / sticker A4. Gunting ikut garisan putus-putus.</span></div><button class="x" data-close>×</button></div>
      <div class="np" style="margin:10px 0"><button class="btn" onclick="window.print()">Cetak / Simpan PDF</button></div>
      <div class="labels ${esc(P.a4)}">${items.map(i => `<div class="lbl">${lblBody(i)}</div>`).join('')}</div>`);
    document.body.classList.add('printlbl');
  }
  const ov = $('#ovl .ov'); const old = ov.onclick;
  ov.onclick = e => { if (e.target.classList.contains('ov') || e.target.closest('[data-close]')) { document.body.classList.remove('printlbl', 'printz'); const x = $('#pagesize'); if (x) x.remove(); } old(e); };
}

function admAdjust(){
  $('#adm').innerHTML = `<div class="box"><b>Larasan stok (stock take)</b>
    <p class="mu" style="margin:4px 0 0">Masukkan baki fizikal sebenar. Sistem akan rekod beza sebagai LARASAN.</p>
    <label>Item *</label><select id="ji">${itemOptions(S.items.filter(i => i.aktif), '')}</select>
    <div id="jinfo"></div>
    <label>Baki fizikal *</label><input id="jqty" type="number" min="0" step="any" inputmode="decimal">
    <label>Nama pegawai *</label>${pegSel('joleh')}
    <label>Catatan</label><input id="jcat" maxlength="300" placeholder="cth. Stock take bulanan / rosak / luput">
    <button id="jbtn" class="btn full" style="margin-top:16px">Simpan larasan</button></div>`;
  const info = () => {
    const i = itemBy($('#ji').value), q = $('#jqty').value;
    $('#jinfo').innerHTML = i ? `<div class="info">Baki sistem: <b>${fmtN(i.baki)} ${esc(i.unit)}</b>${q !== '' ? ` · Beza: <b>${(Number(q) - i.baki > 0 ? '+' : '') + fmtN(Number(q) - i.baki)}</b>` : ''}</div>` : '';
  };
  $('#ji').onchange = info; $('#jqty').oninput = info;
  $('#jbtn').onclick = async () => {
    const kod = $('#ji').value, q = $('#jqty').value, oleh = $('#joleh').value.trim();
    if (!kod) return toast('Pilih item.', true);
    if (q === '' || Number(q) < 0) return toast('Isi baki fizikal.', true);
    if (!oleh) return toast('Pilih nama pegawai.', true);
    const b = $('#jbtn'); busy(b, true, 'Menyimpan…');
    try {
      const r = await run('recordTx', { kod, jenis: 'LARASAN', qty: Number(q), oleh, catatan: $('#jcat').value, token: S.token });
      const i = itemBy(kod); if (i) { i.baki = r.baki; i.status = r.status; i.nilai = r.nilai; i.harga = r.harga; }
      toast(`Larasan disimpan. Baki ${r.nama}: ${fmtN(r.baki)} ${r.unit}`);
      $('#jqty').value = ''; $('#jcat').value = ''; info(); load(true);
    } catch(e) { fail(e); }
    busy(b, false);
  };
}

async function admAkses(){
  $('#adm').innerHTML = '<div class="ld">Memuatkan…</div>';
  let cur = '';
  try { cur = await run('getAkses', S.token); } catch(e) { return fail(e); }
  $('#adm').innerHTML = `<div class="box" style="max-width:460px"><b>Kod akses sistem</b>
    <p class="mu" style="margin:4px 0 0">Kod ini diminta setiap kali link sistem dibuka pada peranti baru. Kongsi dengan staf unit sahaja.</p>
    <div class="info" style="margin-top:10px">Kod semasa: <b id="akcur" style="font-size:20px;letter-spacing:2px">${esc(cur)}</b></div>
    <label>Kod akses baru <span class="mu" style="font-weight:400">— 4–20 huruf/nombor</span></label>
    <input id="ak1" maxlength="20" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:2px">
    <label>Ulang kod baru</label><input id="ak2" maxlength="20" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:2px">
    <div class="warn" style="margin-top:12px">Selepas ditukar, <b>semua peranti</b> (termasuk telefon staf yang sudah simpan kod lama) perlu masukkan kod baru.</div>
    <button id="akb" class="btn full">Tukar kod akses</button></div>`;
  $('#akb').onclick = async () => {
    const k1 = $('#ak1').value.trim().toUpperCase(), k2 = $('#ak2').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{4,20}$/.test(k1)) return toast('Kod mesti 4–20 huruf/nombor.', true);
    if (k1 !== k2) return toast('Kod tidak sama.', true);
    if (!confirm('Tukar kod akses kepada ' + k1 + '?')) return;
    const b = $('#akb'); busy(b, true, 'Menyimpan…');
    try {
      const r = await run('setAkses', S.token, k1);
      S.akses = r; ls.set('estok_akses', r); $('#akcur').textContent = r; $('#ak1').value = $('#ak2').value = '';
      toast('Kod akses ditukar. Maklumkan kod baru kepada staf.');
    } catch(e) { fail(e); }
    busy(b, false);
  };
}

function admSet(){
  $('#adm').innerHTML = `<div class="box" style="max-width:520px"><b>Tetapan</b>
    <label>Kategori item <span class="mu" style="font-weight:400">— satu kategori setiap baris</span></label><textarea id="skat">${esc(S.kategori.join('\n'))}</textarea>
    <p class="mu">Senarai nama pegawai/staf kini diurus di <b>Urus staf</b>.</p>
    <button id="sbtn" class="btn full" style="margin-top:6px">Simpan tetapan</button></div>`;
  $('#sbtn').onclick = async () => {
    const b = $('#sbtn'); busy(b, true, 'Menyimpan…');
    try {
      const r = await run('saveSettings', S.token, $('#skat').value.split('\n').map(x => x.trim()).filter(Boolean));

function admPw(){

    <label>Password lama</label><input id="p0" type="password" autocomplete="current-password">
    <label>Password baru (min 6 aksara)</label><input id="p1" type="password" autocomplete="new-password">
    <label>Ulang password baru</label><input id="p2" type="password" autocomplete="new-password">

  $('#pbtn').onclick = async () => {

    catch(e) { fail(e); busy(b, false); }
  };
}

$('#kunci').onclick = e => { e.preventDefault(); if (!confirm('Padam kod akses dari peranti ini?')) return; S.akses = ''; try { localStorage.removeItem('estok_akses'); } catch(x) {} saveTok(null); gate(); };
if (S.akses) load(); else gate();
